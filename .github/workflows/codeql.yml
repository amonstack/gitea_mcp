name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 12 * * 1" # every Monday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # AlertSuppression makes `// codeql[rule-id]` comments take effect:
          # the default suites do not run it, so inline suppressions would be
          # ignored (the remaining `js/file-access-to-http` suppression at the
          # doRequest multipart fetch sink is intentional and documented in
          # docs/architecture.md §5.3 — without this pack it silently does
          # nothing). The credential-flow suppressions were removed with the
          # flow itself in issue #79 (credential retrieval now goes through
          # git subprocesses, so there is no file-read source to suppress).
          # The local pack vendored per #79 runs the file-access-to-http
          # query with a function-scoped barrier on the confined upload
          # reader (`readUploadFile`, #76) under its own rule id — the stock
          # rule above keeps running unchanged for everything else.
          packs: |
            codeql/javascript-queries:AlertSuppression.ql
            ./.github/codeql

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
